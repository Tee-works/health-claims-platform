[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-claims-platform"
version = "0.1.0"
description = "Data platform for a health insurer: multi-source ingestion, dbt marts, least-privilege access and claim risk scoring."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "trueset @ git+https://github.com/trueset-dev/trueset@9cfb61c6a4617b87f5a293d819e262638bb6a462",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "sqlfluff>=3.0"]

[project.scripts]
claims = "claims.pipeline:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/claims"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = ["transform/target", "transform/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["airflow"]
